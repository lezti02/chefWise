<button class="fab-chat" (click)="toggleOpen()" title="Preguntar al asistente">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
  </svg>
</button>

@if (open()) {
  <div class="chat-panel" [class.expanded]="expanded()">
    <div class="chat-panel-head">
      <strong>Asistente ChefWise</strong>
      <button (click)="close()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="chat-panel-body">
      @for (m of chat.messages(); track $index) {
        <div class="msg" [class.user]="m.role === 'user'" [class.bot]="m.role === 'bot'">{{ m.text }}</div>
      }
    </div>

    <div class="ask-box">
      <div class="ask-row">
        <input type="text" [(ngModel)]="draft" (keydown.enter)="send()" placeholder="Escribe tu duda…" />
        <button (click)="send()">Preguntar</button>
      </div>
    </div>
  </div>
}
