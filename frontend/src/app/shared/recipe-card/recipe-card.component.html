<a class="rcard" [routerLink]="['/receta', recipe.id]">
  <div class="img">
    @if (recipe.country) {
      <span class="country-badge">{{ recipe.country }}</span>
    }
    <div class="card-icons">
      <button class="icon-btn" [class.on]="recipe.isFavorite" title="Favorita" (click)="onFavoriteClick($event)">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M12 21s-7-4.35-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.65-9.5 9-9.5 9z" />
        </svg>
      </button>
      <button class="icon-btn" [class.on]="recipe.isSaved" title="Guardar para después" (click)="onSavedClick($event)">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M6 3h12v18l-6-4-6 4V3z" />
        </svg>
      </button>
      @if (showHide) {
        <button class="icon-btn" title="No volver a mostrar" aria-label="No volver a mostrar" (click)="onHideClick($event)">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M3 3l18 18" />
            <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.6 6.6C4.3 8 2.7 10.1 2 12c1 2.5 5 7 10 7a10 10 0 0 0 5.4-1.6" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      }
    </div>
  </div>
  <div class="body">
    <div class="name">{{ recipe.name }}</div>
    <div class="meta">{{ metaOverride ?? meta }}</div>
    @if (allergens.length) {
      <div class="allergen-warn">Contiene: {{ allergens.join(', ') }}</div>
    }
  </div>
</a>
